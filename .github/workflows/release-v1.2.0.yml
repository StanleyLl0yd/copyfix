name: Publish accepted CopyFix 1.2.0

# One-version gate. Downloads only the EXE built by successful exact-main CI.
on:
  workflow_run:
    workflows: ["Windows CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: copyfix-release-v1.2.0
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact CI commit without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Gate approved PR, exact main, release version and absent tag
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CI_SHA"
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          if [ "$CI_SHA" != "$main_sha" ]; then
            echo "::notice::main advanced after CI; refusing to publish a stale commit."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The accepted candidate merges onto the protected 1.1.0 main.
          test "$(git rev-parse HEAD^)" = "28e8bf2040370f90bcf87cbbc768468826de7e7a"
          approved_pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$CI_SHA/pulls" \
            --jq '[.[] | select(.number == 40 and .merged_at != null)] | length')"
          test "$approved_pr" = "1"
          grep -Eq 'project\(CopyFix LANGUAGES CXX VERSION 1\.2\.0\)' CMakeLists.txt
          if gh release view v1.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::v1.2.0 already exists; not publishing again."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.2.0" >/dev/null 2>&1; then
            echo "::error::v1.2.0 tag exists without a release; refusing to overwrite."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Fetch one portable EXE from successful exact-main Windows CI
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name CopyFix-Windows-x64-EXE-only --dir dist
          test -s dist/CopyFix.exe
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 1
          file dist/CopyFix.exe | grep -q 'PE32+ executable'
          sha256sum dist/CopyFix.exe

      - name: Publish accepted v1.2.0 with one unsigned CopyFix.exe
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          checksum="$(sha256sum dist/CopyFix.exe | cut -d' ' -f1)"
          bytes="$(stat -c '%s' dist/CopyFix.exe)"
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## CopyFix 1.2.0 — Windows

          - Refreshed native Win32 Fluent-style design: Settings C, Preview A, About C, in light and dark.
          - New **Appearance** control: automatic Windows theme, Light, or Dark, with live preview and Cancel rollback.
          - New **Language** control: automatic Windows display language, Русский, or English. Windows, menus, notifications, and warnings are localized.
          - Compact card layout, segmented processing profiles, improved typography, DPI and focus behavior.
          - Fixed corrupt hotkey dropdown text and excessive popup height; supported shortcuts and conflict rollback are preserved.
          - Side-by-side native RichEdit preview with restrained difference highlighting and independent scroll positions.
          - Fixed white icon background and rounded-button corner artifacts in dark About.
          - Existing text processing, clipboard protections and Undo behavior retained. No third-party UI runtime, installer, telemetry, or network dependency.

          **Distribution:** one unsigned portable `CopyFix.exe` for Windows x64.
          **Size:** `__BYTES__` bytes.
          **SHA-256:** `__SHA256__`

          **Source commit:** `__SHA__`
          **Exact-main CI:** https://github.com/StanleyLl0yd/copyfix/actions/runs/__RUN_ID__

          Visual acceptance granted by the owner on 2026-11-05. Built by the protected exact-main CI, not from a PR artifact.
          EOF
          sed -i \
            -e "s|__BYTES__|$bytes|g" \
            -e "s|__SHA256__|$checksum|g" \
            -e "s|__SHA__|$CI_SHA|g" \
            -e "s|__RUN_ID__|$RUN_ID|g" "$RUNNER_TEMP/release-notes.md"
          gh release create v1.2.0 dist/CopyFix.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "CopyFix 1.2.0" \
            --target "$CI_SHA" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest
          echo "Published v1.2.0 from protected $CI_SHA (CI $RUN_ID)." >> "$GITHUB_STEP_SUMMARY"

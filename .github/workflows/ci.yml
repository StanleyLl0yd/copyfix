name: Windows CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    name: MSVC v143 x64 /MT and PE
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check installed toolchain
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC v143 is not installed' }
          $tools = Get-ChildItem (Join-Path $vs 'VC\Tools\MSVC') -Directory | Sort-Object Name -Descending
          if (-not $tools) { throw 'MSVC toolset unavailable' }
          Write-Host "Visual Studio: $vs"
          Write-Host "MSVC v143: $($tools[0].Name)"
      - name: Verify approved icon sources and ICO sizes
        run: python tools/check-icon.py
      - name: Configure C++20
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build static Release x64
        run: cmake --build build --config Release --parallel 2
      - name: Core unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Inspect EXE and dependencies
        shell: pwsh
        run: |
          ./tools/check-pe.ps1 -Exe 'build/Release/CopyFix.exe' -OutDir 'build/pe-report'
      - name: Export standalone EXE only (not a GitHub Release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: CopyFix-Windows-x64-EXE-only
          if-no-files-found: error
          retention-days: 14
          archive: true
          path: build/Release/CopyFix.exe

  core-sanitizers:
    name: Clang C++20 / ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify JSON golden cases match the checked-in C++ fixture
        run: |
          python3 tools/generate-golden-header.py
          git diff --exit-code -- tests/golden_cases.inc
      - name: Configure strict C++20 with sanitizers
        run: |
          clang++ --version
          cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build sanitized core and tests
        run: cmake --build build-sanitize --parallel 2
      - name: Test core, preview diff and integrity under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitize --output-on-failure

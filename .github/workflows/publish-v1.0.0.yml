name: Publish CopyFix 1.0.0
on:
  workflow_run:
    workflows: ["Windows CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  release:
    name: Publish verified Windows 1.0.0
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_commit.message, 'release: prepare Windows 1.0.0 (#36)')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Require the exact authorized 1.0.0 main commit and successful CI jobs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "StanleyLl0yd/copyfix"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" = "$TARGET_SHA"
          test "$(git show -s --format=%s HEAD)" = "release: prepare Windows 1.0.0 (#36)"
          grep -Fxq 'project(CopyFix LANGUAGES CXX VERSION 1.0.0)' CMakeLists.txt
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '.conclusion')" = "success"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '.head_sha')" = "$TARGET_SHA"
          names="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.conclusion == "success") | .name')"
          grep -Fxq 'MSVC v143 x64 /MT and PE' <<< "$names"
          grep -Fxq 'Clang C++20 / ASan + UBSan' <<< "$names"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.0" >/dev/null 2>&1; then
            echo 'Refusing to overwrite existing v1.0.0 tag' >&2
            exit 1
          fi
      - name: Download and verify the exact-main Windows CI EXE
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name CopyFix-Windows-x64-EXE-only --dir dist
          test "$(find dist -type f | wc -l)" -eq 1
          test -f dist/CopyFix.exe
          size="$(stat -c %s dist/CopyFix.exe)"
          test "$size" -ge 200000
          test "$size" -le 1000000
          file dist/CopyFix.exe
          sha256sum dist/CopyFix.exe
          echo "EXE_SHA256=$(sha256sum dist/CopyFix.exe | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          echo "EXE_BYTES=$size" >> "$GITHUB_ENV"
      - name: Create the explicitly authorized GitHub Release and tag
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          # CopyFix 1.0.0 — Windows 10/11 x64

          First stable Windows release. Standalone portable Win32 application, with no installer,
          additional runtime DLLs, network access, telemetry, or clipboard history.

          - Gentle, Smart and Deep local text cleanup (Deep is the first-run default).
          - PDF copied-text line joining with an explicit preview for ambiguous changes.
          - Protects structured data and newer clipboard contents; supports one-step plain-text Undo.
          - Tray integration, configurable hotkey, HKCU-only settings, multi-monitor About dialog.
          - About version and Windows EXE details match 1.0.0.
          - MIT license: https://github.com/StanleyLl0yd/copyfix/blob/main/LICENSE
          - Website: https://stanleyll0yd.github.io/apps/copyfix/

          **Download:** CopyFix.exe (Windows 10/11 x64). The executable is **unsigned**.
          Windows SmartScreen/security warnings may appear. Code signing is intentionally deferred.

          **SHA-256 (CopyFix.exe):** \`$EXE_SHA256\`
          **Size:** $EXE_BYTES bytes.
          **Source commit:** \`$TARGET_SHA\`
          **Windows build evidence:** https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID
          EOF
          gh release create v1.0.0 dist/CopyFix.exe \
            --repo "$GITHUB_REPOSITORY" --target "$TARGET_SHA" \
            --title "CopyFix 1.0.0" --notes-file release-notes.md --latest

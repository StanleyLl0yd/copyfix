name: Publish accepted CopyFix 1.1.0

# One-version release gate. Never publishes pull-request artifacts.
# Runs only after the exact-main Windows CI (both Windows + sanitizer jobs) passes.
on:
  workflow_run:
    workflows: ["Windows CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: copyfix-release-v1.1.0
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact CI commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify approved version, exact main and no pre-existing release
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CI_SHA"
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          if [ "$CI_SHA" != "$main_sha" ]; then
            echo "::notice::main advanced after CI; refusing to release an older commit."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          grep -Eq 'project\(CopyFix LANGUAGES CXX VERSION 1\.1\.0\)' CMakeLists.txt
          if gh release view v1.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::v1.1.0 already released; no mutation."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.1.0" >/dev/null 2>&1; then
            echo "::error::v1.1.0 tag exists but Release is missing; refusing to overwrite it."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Download artifact produced by successful exact-main CI
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name CopyFix-Windows-x64-EXE-only --dir dist
          test -s dist/CopyFix.exe
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 1
          file dist/CopyFix.exe | grep -q 'PE32+ executable'
          sha256sum dist/CopyFix.exe

      - name: Publish immutable v1.1.0 release with one portable EXE
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          checksum="$(sha256sum dist/CopyFix.exe | cut -d' ' -f1)"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## CopyFix 1.1.0 — Windows

          - Custom global keyboard shortcuts: native Ctrl / Alt / Shift options and a full supported key list.
          - Default remains **Ctrl+Alt+F9**. Previously saved combinations are preserved on upgrade.
          - Occupied or reserved combinations show a warning and preserve the former active shortcut.
          - Settings, preview and About windows open centered on the current monitor.
          - Settings no longer displays technical HKCU / INI details.
          - Standard Windows notification on successful startup.
          - No keyboard hooks, new runtime dependencies, background clipboard monitoring or network access.

          **Distribution:** one unsigned portable `CopyFix.exe` for Windows x64.

          **SHA-256:** `$checksum`
          
          **Source commit:** `$CI_SHA`
          **Exact-main verification:** https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID

          All 16 user acceptance checks passed; startup notification accepted separately.
          EOF
          gh release create v1.1.0 dist/CopyFix.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "CopyFix 1.1.0" \
            --target "$CI_SHA" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest
          echo "Released v1.1.0 at $CI_SHA" >> "$GITHUB_STEP_SUMMARY"
